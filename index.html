<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#008080" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="winampify.exe - A retro Windows 98-style Spotify Web Player"
    />
    <link rel="icon" type="image/png" href="/assets/wm-0.png" />
    <title>winampify.exe</title>
    <script>
      // Pick the saved skin before anything paints (see src/contexts/ThemeContext.jsx)
      try { if (localStorage.getItem('winampify-skin') === 'xp') document.documentElement.setAttribute('data-skin', 'xp'); } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
