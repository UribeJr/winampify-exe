<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Original artwork for Winampify: a sunny sky over rolling green hills -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f5fd1"/>
      <stop offset="0.45" stop-color="#4f93ea"/>
      <stop offset="1" stop-color="#b9dcf7"/>
    </linearGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc24a"/>
      <stop offset="1" stop-color="#3f8f2a"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fb93a"/>
      <stop offset="0.6" stop-color="#3a9a24"/>
      <stop offset="1" stop-color="#256f17"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.85" filter="url(#soft)">
    <ellipse cx="300" cy="210" rx="190" ry="42"/>
    <ellipse cx="420" cy="185" rx="120" ry="38"/>
    <ellipse cx="1130" cy="150" rx="230" ry="46"/>
    <ellipse cx="1290" cy="175" rx="150" ry="36"/>
    <ellipse cx="760" cy="300" rx="160" ry="30"/>
  </g>
  <path d="M0 640 C 260 520, 520 520, 820 600 S 1350 700, 1600 560 L 1600 1000 L 0 1000 Z" fill="url(#hillBack)"/>
  <path d="M0 760 C 300 610, 700 600, 1000 700 S 1450 830, 1600 740 L 1600 1000 L 0 1000 Z" fill="url(#hillFront)"/>
  <path d="M0 760 C 300 610, 700 600, 1000 700 S 1450 830, 1600 740 L 1600 1000 L 0 1000 Z" fill="url(#glow)"/>
</svg>
